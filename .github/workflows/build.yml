name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # dd.ps1 locates Visual Studio, enters the MSVC environment and falls back
      # to the CMake and Ninja that ship with it, so there is nothing to install.
      - name: Build Debug
        shell: pwsh
        run: .\dd.ps1 build -Config Debug

      # Deterministic: lays out a local file with no window and no network, so a
      # failure here is always a real regression.
      - name: Headless layout
        shell: pwsh
        run: .\dd.ps1 layout test-files\site-elements.html --width:1200

      # The unit suite, which also fetches four live URLs — this step can fail
      # for reasons unrelated to a change if the network is unhappy.
      - name: Regression gate
        shell: pwsh
        run: .\dd.ps1 test
